# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Read more on this at https://github.com/neoforged/ModDevGradle
# Optional: absolute path to a JDK 21 installation used as the Java toolchain.
# Only needed when Gradle itself is not started with a JDK 21. Overridable on the
# command line with -Pjdk21_path=...
#jdk21_path=F:/JDK/JDK21

# Optional Parchment mappings (currently disabled in build.gradle to reduce downloads).
# The latest versions can be found at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# The latest versions can be found here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version this mod is COMPILED against. It is deliberately the first release of the
# 21.1 line (for Minecraft 1.21.1) so that everything used here is guaranteed to exist on every
# 21.1.x build. It is NOT the minimum required version - see neo_version_range below.
neo_version=21.1.1
# The Neo version RANGE this mod requires at runtime. Any 1.21.1 NeoForge build satisfies it:
# 21.1.x compares higher than 21.1.1, and 21.2+ (or 21.0.x) is excluded.
neo_version_range=[21.1.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
# Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the MOD_ID constant in the main mod class annotated with @Mod.
mod_id=nobats
# The human-readable display name for the mod.
mod_name=No Bats
# The license of the mod. Review your options at https://choosealicense.com/
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. Should match the base package used for the mod sources.
mod_group_id=com.antibat.nobats
# The authors of the mod, displayed in the mod UI.
mod_authors=Cloudldust
# The description of the mod, displayed in the mod UI and on mod listings.
mod_description=Prevents bats from ever entering the world. Natural spawns, structure spawns, spawners, spawn eggs and /summon are all blocked, and bats already present in a saved world are removed.
